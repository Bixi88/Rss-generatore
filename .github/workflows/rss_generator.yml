name: Genera feed RSS AnkerGames

on:
  schedule:
    - cron: "17 */6 * * *"   # ogni 6 ore (al minuto 17)
  workflow_dispatch:          # avvio manuale da Actions

permissions:
  contents: write             # necessario per il git push

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed
        run: python scraper.py

      - name: Keepalive mensile
        # Un commit al mese evita che GitHub disattivi il workflow
        # dopo 60 giorni di inattività del repository.
        run: date -u +%Y-%m > .keepalive

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml seen.json .keepalive
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Aggiorna feed RSS"
          git pull --rebase
          git push
